name: Refresh official IEG snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '25 8 1 * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python fetch.py
      - name: Commit updated source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ieg_ratings.csv
          if ! git diff --cached --quiet; then
            git commit -m "Refresh IEG project ratings snapshot"
            git push
          fi
